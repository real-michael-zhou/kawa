name: Release

# Push a tag like v1.2.0 to build Kawa-<version>.dmg and publish it as a
# GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15 # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: ./scripts/build-deps.sh

      - name: Build and package
        id: package
        run: echo "dmg=$(./scripts/package.sh | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.dmg }}" \
            --title "Kawa $GITHUB_REF_NAME" \
            --notes "Apple Silicon (arm64), macOS 12.0 or later. See README for how to open an unsigned app."
